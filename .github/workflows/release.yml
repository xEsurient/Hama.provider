# Release: bump __version__ in provider/hama_provider/__init__.py and push to main. When no tag v<version> exists yet, this workflow:
#   1. runs the tests (Python 3.8 and 3.12)
#   2. builds the Docker image for amd64/arm64/arm-v7 and pushes it to ghcr.io/xesurient/hama.provider:<version>, :<major.minor> and :latest
#   3. creates the GitHub release v<version> with the Docker bundle (compose.yml + .env.example), the provider zip and SHA256SUMS
# Pushes without a version bump (or only changing .md files) run the tests and publish nothing, so a released image is never overwritten.
# A release published by hand (tag v<version>) still works and gets the image and assets. Actions > Release > Run workflow can push
# the image for the current version without a release.
# Afterwards users only need:  docker pull ghcr.io/xesurient/hama.provider:latest   (or the Docker bundle from the release page)
# First release: make the package public once (GitHub > your profile > Packages > the package > Package settings > Change visibility).
name: Release

on:
  push:
    branches: [main, master]
    paths:
      - "provider/**"
      - "!provider/**/*.md"
      - ".github/workflows/release.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Build and push the image (ghcr.io) for the current version"
        type: boolean
        default: false

concurrency:            # one run at a time; a newer push waits, so two runs never release the same version
  group: release
  cancel-in-progress: false

permissions:
  contents: write      # create releases, attach assets
  packages: write      # push to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (Python ${{ matrix.python }})
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/provider:/src:ro" -w /src -e PYTHONDONTWRITEBYTECODE=1
          python:${{ matrix.python }}-slim python -m unittest discover -s tests

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the code version and decide whether to publish
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' provider/hama_provider/__init__.py)
          PUBLISH=false
          case "${{ github.event_name }}" in
            release)
              if [ "${{ github.event.release.tag_name }}" != "v$VERSION" ]; then
                echo "::error::Release tag ${{ github.event.release.tag_name }} doesn't match provider version v$VERSION"; exit 1
              fi
              PUBLISH=true ;;
            push)
              if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
                echo "::notice::v$VERSION is already released; bump __version__ to publish this change"
              else
                PUBLISH=true
              fi ;;
            workflow_dispatch)
              PUBLISH=${{ inputs.push_image }} ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=HAMA provider
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: provider
          file: provider/install/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [version, image]     # only after the image is pushed, so a release always has its image
    if: needs.version.outputs.publish == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release assets
        run: python3 provider/install/release/make_assets.py --image "${{ needs.version.outputs.image }}" --version "${{ needs.version.outputs.version }}" --out dist
      - name: Create the release (push) or attach to it (release published by hand)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
